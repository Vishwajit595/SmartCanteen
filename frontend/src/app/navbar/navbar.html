<nav class="navbar">

  <div class="navbar-container">

    <a routerLink="/" class="logo">
      🍴 SmartCanteen
    </a>

    <div class="nav-links">

      <!-- Always visible -->
      <a routerLink="/menu">
        Menu
      </a>

      <!-- Logged-in user -->
      @if (isLoggedIn) {

        <a routerLink="/cart">
          🛒 Cart
        </a>

        <a routerLink="/my-orders">
          📦 My Orders
        </a>

        <a routerLink="/staff-dashboard">
          👨‍🍳 Staff
        </a>

        <button
          class="logout-button"
          (click)="logout()">
          Logout
        </button>

      }

      <!-- Logged-out user -->
      @if (!isLoggedIn) {

        <a routerLink="/login">
          Login
        </a>

        <a routerLink="/register">
          Register
        </a>

      }

    </div>

  </div>

</nav>
